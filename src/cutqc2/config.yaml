# A section for testing purposes
pytest:
  astring: foo
  atrue: true
  afalse: false
  nested:
    aint: 42
  # A variable that is obtained from an environment variable
  # If no environment variable exists, then no value is substituted.
  adynamic: "{CUTQC2_PYTEST_ENV_VAR}"
  # A special variable __dir__that points to the directory of this config
  # file. It has a leading slash but no trailing slash
  # A prefix and suffix are added below for illustrative purposes
  aspecial: foo__dir__/bar  # foo/path/to/this/dir/bar
  anull: ~


core:
  # Whether to insist on loading CutCircuit from files with matching version
  string_file_versioning: True
  # Which numeric library to use - cupy/numpy
  numeric: cupy
  # Default backend to use for evaluating circuits. One of:
  # statevector_simulator - best for local testing and small circuits.
  # aer_gpu_simulator - if you want to use a GPU.
  # noiseless_qasm_simulator
  backend: aer_gpu_simulator
