name: Test pinned dependencies

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build_wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, self-hosted]
        python-version: ["3.12"]

    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    environment: CI

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Create venv
      run: |
        uv venv --python ${{ matrix.python-version }}

    - name: Setup (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install open-mpi

    - name: Install requirements
      if: ${{ matrix.os == 'self-hosted' }}
      run: uv pip install --python .venv/bin/python -r requirements.txt

    - name: Install requirements
      if: ${{ matrix.os == 'macos-latest' }}
      run: uv pip install --python .venv/bin/python -r requirements-macos.txt

    - name: Install package with no deps
      run: uv pip install --python .venv/bin/python -e . --no-deps

    - name: Pre-commit checks
      run: |
          uvx pre-commit run --all-files

    - name: Install qiskit-aer-gpu
      if: ${{ matrix.os == 'self-hosted' }}
      # Due to a known issue with a very specific version
      # of qiskit-aer-gpu working with qiskit-aer
      # we manually install the required version here.
      # Things seem to work only if we do this *after*
      # having install qiskit-aer before.
      # See https://github.com/Qiskit/qiskit-aer/issues/2336
      run: |
        uv pip install --python .venv/bin/python qiskit-aer-gpu-cu11 

    - name: Pytest with coverage
      if: ${{ matrix.os == 'self-hosted' }}
      run: |
        module load openmpi/gcc/4.1.6
        uv run --no-project coverage run --source=src/cutqc2 --omit="src/cutqc2/legacy/*" -m pytest
      env:
        GUROBI_WLSACCESSID: ${{ vars.GUROBI_WLSACCESSID }}
        GUROBI_LICENSEID: ${{ vars.GUROBI_LICENSEID }}
        GUROBI_WLSSECRET: ${{ secrets.GUROBI_WLSSECRET }}

    - name: Pytest
      if: ${{ matrix.os == 'macos-latest' }}
      run: |
        uv run --no-project -m pytest
      env:
        GUROBI_WLSACCESSID: ${{ vars.GUROBI_WLSACCESSID }}
        GUROBI_LICENSEID: ${{ vars.GUROBI_LICENSEID }}
        GUROBI_WLSSECRET: ${{ secrets.GUROBI_WLSSECRET }}
        CUTQC2_CORE_BACKEND: statevector_simulator

    - name: Upload coverage to Coveralls
      if: ${{ matrix.os == 'self-hosted' }}
      run: uv run --no-project coveralls
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}